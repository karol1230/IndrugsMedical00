<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indrugs</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <link th:href="@{/css/11.estilos_registrar_usuario.css}" rel="stylesheet" />

</head>

<body>

<main class="cuerpo_indrugs">
    <div class="contenido">
        <div class="datos_registrarse">
            <form th:action="@{/registrar}" method="post" th:object="${usuarioNuevo}"
                  class="form-grid needs-validation" novalidate>

                <h1 class="full">Registrarse</h1>

                <div th:if="${error}" class="full alert alert-danger">
                    <span th:text="${error}"></span>
                </div>

                <div th:if="${mensaje}" class="full alert alert-success">
                    <span th:text="${mensaje}"></span>
                </div>

                <!-- Rol -->
                <div>
                    <label class="form-label">Rol</label>
                    <select class="form-select" th:field="*{rol}" required>
                        <option value="" disabled selected>Elija su rol</option>
                        <option value="2">Paciente</option>
                        <option value="3">Domiciliario</option>
                    </select>
                </div>

                <!-- Tipo doc -->
                <div>
                    <label class="form-label">Tipo de documento</label>
                    <select class="form-select" th:field="*{tipoDoc}" required>
                        <option value="" disabled selected>Seleccione</option>
                        <option value="CC">Cédula de ciudadanía</option>
                        <option value="TI">Tarjeta de identidad</option>
                    </select>
                </div>

                <!-- Documento -->
                <div>
                    <label class="form-label">Número de documento</label>
                    <input type="number" class="form-control" th:field="*{numDoc}" required minlength="8">
                </div>

                <!-- Nombre -->
                <div>
                    <label class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <!-- Correo (fila completa) -->
                <div class="full">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" th:field="*{correo}" required>
                </div>

                <!-- Dirección (fila completa) -->
                <div class="full">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control" th:field="*{direccion}" required>
                </div>

                <!-- Teléfono -->
                <div>
                    <label class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" th:field="*{telefono}" minlength="7" maxlength="10" required>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" th:field="*{password}" minlength="8" required>
                </div>

                <!-- Botón (fila completa) -->
                <div class="full">
                    <button class="btn btn-primary" type="submit">Registrarse</button>
                </div>

            </form>



        </div>
    </div>
</main>

    <script>
        (() => {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');

            Array.from(forms).forEach(form => {
                form.addEventListener(
                    'submit',
                    event => {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    },
                    false,
                );
            });
        })();
    </script>

</footer>
</body>
</html>
