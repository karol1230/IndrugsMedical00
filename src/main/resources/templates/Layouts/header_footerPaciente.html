<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <header class="cabeza_indrugs">

        <!-- LOGO -->
        <div class="contenedeor_cabeza logo_nav_items">
            <a th:href="@{/index}" class="logo">
                <img class="img_indrugs_logo" th:src="@{/imagenes/logo.png}" alt="Logo">
                INDRUGS MEDICAL
            </a>
        </div>

        <hr class="linea_separación">

        <!-- MENÚ PRINCIPAL -->
        <div class="contenedeor_cabeza logo_nav_items">
            <nav class="menu">
                <ul class="barra_2">
                    <li id="items_barra"><a id="enlaces_barra" th:href="@{/1.pagina_principal_paciente}">Inicio</a></li>
                    <li id="items_barra"><a id="enlaces_barra" th:href="@{/24.pagina_control}">Control</a></li>
                    <li id="items_barra"><a id="enlaces_barra" th:href="@{/8.pagina_med}">Medicamentos</a></li>
                    <li id="items_barra"><a id="enlaces_barra" th:href="@{/5.pagina_pqrs}">PQRS</a></li>

                    <!-- ✅ Login / Logout -->
                    <li id="items_barra" th:if="${session.usuarioLogueado == null}">
                        <a id="enlaces_barra" th:href="@{/login}">Iniciar sesión</a>
                    </li>

                    <li id="items_barra" th:if="${session.usuarioLogueado != null}">
                        <a id="enlaces_barra" th:href="@{/logout}">Cerrar sesión</a>
                    </li>

                </ul>
            </nav>

            <!-- ICONOS DERECHA -->
            <nav class="navegacion_1">
                <ul class="barra_1">

                    <!-- 🛒 CARRITO (Se queda) -->
                    <li id="items_barra1">
                        <a th:href="@{/16.pagina_carrito_med}" id="enlaces_barra1">
                            <img id="iconos" th:src="@{/Iconos/compras.png}" alt="Carrito">
                        </a>
                    </li>

                    <!-- 🚪 Logout ícono -->
                    <li id="items_barra1" th:if="${session.usuarioLogueado != null}">
                        <a th:href="@{/logout}" id="enlaces_barra1">
                            <img id="iconos" th:src="@{/Iconos/icons8-cerrar-sesión-96.png}" alt="Cerrar sesión">
                        </a>
                    </li>

                    <!-- 🔐 Si no hay sesión → muestra icono login -->
                    <li id="items_barra1" th:if="${session.usuarioLogueado == null}">
                        <a th:href="@{/login}" id="enlaces_barra1">
                            <img id="iconos" th:src="@{/Iconos/icons8-cerrar-sesión-96.png}" alt="Login">
                        </a>
                    </li>

                </ul>
            </nav>
        </div>

        <hr class="linea_separación">

    </header>
</div>

<div th:fragment="error" xmlns:th="http://www.thymeleaf.org">
    <div th:if="${mensaje}" class="alert alert-success" role="alert">
        <span th:text="${mensaje}"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>
</div>

<footer th:fragment="footer" xmlns:th="http://www.thymeleaf.org"
        style="background: linear-gradient(180deg, #00796b 0%, #00695c 100%);
               color:#f1fffb; padding:20px 0; text-align:center;
               font-family:'Poppins',sans-serif;">

    <div style="margin-bottom:10px;">
        <img th:src="@{/imagenes/logo.png}" alt="Logo" style="width:60px; margin-bottom:5px;">
        <p style="font-size:1em; font-weight:500; margin:0;">
            © 2025 INDRUGS MEDICAL — Cuidado y bienestar para todos 💊
        </p>
    </div>

    <div style="font-size:0.9em; line-height:1.6;">
        <p><strong>Dirección:</strong> Calle 82 B N° 95 D-14, Bogotá, Colombia</p>
        <p><strong>Teléfono:</strong> +57 (320) 456-7890</p>
        <p><strong>Email:</strong> indrugsmedica@gmail.com</p>
    </div>

</footer>
