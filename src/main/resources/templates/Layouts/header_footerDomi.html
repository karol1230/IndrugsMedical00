<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
  <header class="cabeza_indrugs">
    <div class="contenedeor_cabeza logo_nav_items">
      <a th:href="@{/index}" class="logo">
        INDRUGS MEDICA
      </a>
    </div>

    <hr class="linea_separación">

    <div class="contenedeor_cabeza logo_nav_items">
      <nav class="menu">
        <ul class="barra_2">
          <li id="items_barra"><a th:href="@{/11.pagina_principal_domiciliario}" id="enlaces_barra">Inicio</a></li>
          <li id="items_barra"><a th:href="@{/12.pagina_vehiculos}" id="enlaces_barra">Vehículos</a></li>
          <li id="items_barra"><a th:href="@{/14.pagina_ordenes}" id="enlaces_barra">Órdenes</a></li>
          <li id="items_barra"><a th:href="@{/24.pagina_pedidos_domiciliario}" id="enlaces_barra">Pedidos</a></li>

          <!-- Logout -->
          <li class="item_barra" th:if="${session.usuarioLogueado != null}">
            <a class="enlace_barra" th:href="@{/logout}">
              <i class="fa-solid fa-right-from-bracket"></i>
              Cerrar sesión
            </a>
          </li>

          <!-- Login si no hay sesión -->
          <li id="items_barra" th:if="${session.usuarioLogueado == null}">
            <a th:href="@{/login}" id="enlaces_barra">Iniciar sesión</a>
          </li>
        </ul>
      </nav>

      <!-- ICONOS DERECHA -->
      <nav class="navegacion_1">
        <ul class="barra_1">
          <!-- Icono de perfil para domiciliario (igual que paciente) -->
          <li th:if="${session.usuarioLogueado != null
                      and session.usuarioLogueado.rol.nombreRol == 'Domiciliario'}">
            <a th:href="@{/perfil}" class="enlace_barra1" title="Mi perfil">
              <i class="fa-solid fa-user icono_perfil"
                 style="font-size: 22px; color: white;"></i>
            </a>
          </li>

          <!-- Icono login si no hay sesión -->
          <li th:if="${session.usuarioLogueado == null}">
            <a th:href="@{/login}" class="enlace_barra1">
              <i class="fa-solid fa-right-to-bracket icono_perfil"
                 style="font-size: 22px; color: white;"></i>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <hr class="linea_separación">
  </header>
</div>


<div th:fragment="error" xmlns:th="http://www.thymeleaf.org">
  <div th:if="${mensaje}" class="alert alert-success" role="alert">
    <span th:text="${mensaje}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" role="alert">
    <span th:text="${error}"></span>
  </div>
</div>

<footer th:fragment="footer" xmlns:th="http://www.thymeleaf.org"
        style="background:linear-gradient(180deg,#00796b 0%,#00695c 100%);
               color:#f1fffb;padding:20px 0;text-align:center;
               font-family:'Poppins',sans-serif;">

  <div style="margin-bottom:10px;">
    <img th:src="@{/imagenes/logo.png}" alt="Logo" style="width:60px;margin-bottom:5px;">
    <p style="font-size:1em;font-weight:500;margin:0;">
      © 2025 INDRUGS MEDICAL — Cuidado y bienestar para todos 💊
    </p>
  </div>

  <div style="font-size:0.9em;line-height:1.6;">
    <p><strong>Dirección:</strong> Calle 82 B N° 95 D-14, Bogotá, Colombia</p>
    <p><strong>Teléfono:</strong> +57 (320) 456-7890</p>
    <p><strong>Email:</strong> indrugsmedica@gmail.com</p>
  </div>

</footer>
