<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Órdenes - INDRUGS</title>

    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet" />
    <link th:href="@{/css/14.estilos_pagina_órdenes.css}" rel="stylesheet" />
</head>

<body>
<header th:insert="Layouts/header_footerDomi :: header"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerDomi :: error"></div>

    <div class="contenido">
        <h1><i class="fa-solid fa-file-medical"></i> Órdenes registradas</h1>

        <div th:if="${ordenes != null and !ordenes.isEmpty()}">
            <table id="tabla1" class="table tabla-ordenes">
                <thead class="encabezado-verde">
                <tr>
                    <th><i class="fa-solid fa-id-card"></i> ID</th>
                    <th><i class="fa-solid fa-user"></i> PACIENTE</th>
                    <th><i class="fa-solid fa-hospital"></i> EPS</th>
                    <th><i class="fa-regular fa-calendar-days"></i> FECHA DE ENTREGA</th>
                    <th><i class="fa-solid fa-location-dot"></i> DIRECCIÓN</th>
                    <th><i class="fa-solid fa-phone"></i> TELÉFONO</th>
                    <th><i class="fa-solid fa-box"></i> CANTIDAD</th>
                    <th><i class="fa-solid fa-pills"></i> MEDICAMENTOS</th>
                    <th><i class="fa-solid fa-circle-check"></i> ESTADO</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="orden : ${ordenes}">
                    <td th:text="${orden.idOrden}"></td>
                    <td th:text="${orden.pacienteNombre}"></td>
                    <td th:text="${orden.epsOrden}"></td>
                    <td th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${orden.direccionOrden}"></td>
                    <td th:text="${orden.telefonoOrden}"></td>
                    <td th:text="${orden.cantidad}"></td>
                    <td>
                        <ul class="list-unstyled">
                            <li th:each="medicamento : ${orden.medicamentos}" th:text="${medicamento}"></li>
                        </ul>
                    </td>
                    <td th:text="${orden.estadoOrden}"></td>
                </tr>
                </tbody>
            </table>
        </div>


        <div th:if="${ordenes == null or ordenes.isEmpty()}">
            <p><i class="fas fa-exclamation-circle"></i> No hay órdenes registradas.</p>
        </div>
    </div>
</main>

<footer th:insert="Layouts/header_footerDomi :: footer"></footer>
</body>
</html>
