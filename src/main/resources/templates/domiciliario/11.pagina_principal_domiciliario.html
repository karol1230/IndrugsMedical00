<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Domiciliario - INDRUGS</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/11.pagina_principal_domiciliario.css}" rel="stylesheet">
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
</head>

<body>
<header th:insert="~{Layouts/header_footerDomi :: header}"></header>


<main class="cuerpo_indrugs py-4">
    <div class="container">

        <!-- Bienvenida -->
        <section class="bienvenida text-center mb-5">
            <div class="contenedor-bienvenida">
                <h1 class="fw-bold" style="color: #0D4F13">¡Bienvenido, Domiciliario <span th:text="${nombreDomiciliario}">Domiciliario</span>!</h1>
                <p class="text-muted">Gestiona tus pedidos, revisa tus entregas y sigue creciendo con INDRUGS.</p>
            </div>
        </section>

        <!-- Tablas modernas (una debajo de la otra) -->
        <section class="seccion-tablas">


            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center rounded-top-4">
                    <h5 class="m-0">Pedidos recientes</h5>
                    <a th:href="@{/domiciliario/pedidos}" class="btn btn-light btn-sm">Ver todos</a>
                </div>
                <div class="card-body p-0">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ubicación</th>
                            <th>Entrega</th>
                            <th>Estado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="domicilio : ${domiciliosRecientes}">
                            <td th:text="${domicilio.idDomicilio}">12</td>
                            <td th:text="${domicilio.ubicacionDomicilio}">Calle 10 #15-24</td>
                            <td th:text="${domicilio.fechaEntregaDomicilio}">2025-11-10</td>
                            <td><span class="badge bg-warning text-dark" th:text="${domicilio.estadoDomicilio}">En curso</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>
</main>

<footer th:insert="~{Layouts/header_footerDomi :: footer}"></footer>


</body>
</html>
