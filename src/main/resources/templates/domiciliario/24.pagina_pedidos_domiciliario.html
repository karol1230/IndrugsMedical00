<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos del Domiciliario | INDRUGS</title>

    <!-- 🔗 Estilos y librerías -->
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet"/>
    <link th:href="@{/css/24.pagina_pedidos_domiciliario.css}" rel="stylesheet"/>
</head>

<body>
<!-- 🧭 Header -->
<header th:insert="Layouts/header_footerDomi :: header"></header>

<main class="cuerpo_indrugs container mt-4">
    <div th:insert="Layouts/header_footerDomi :: error"></div>

    <h1 class="text-center mb-4 fw-bold titulo">Pedidos Asignados</h1>


    <!-- 🧾 Tabla de pedidos -->
    <section class="tabla-pedidos">
        <div th:if="${pedidos != null and !pedidos.isEmpty()}">
            <table class="table table-striped table-hover align-middle text-center">
                <thead class="encabezado-verde">

                <tr>
                    <th>Paciente</th>
                    <th>Dirección</th>
                    <th>Hora Pedido</th>
                    <th>Teléfono</th>
                    <th>Observaciones</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.nombrePaciente}">Paciente</td>
                    <td th:text="${pedido.direccion}">Dirección</td>

                    <!-- ✅ Corregido: usar horaPedido -->
                    <td th:text="${#temporals.format(pedido.horaPedido, 'dd/MM/yyyy HH:mm')}">Hora</td>

                    <td th:text="${pedido.telefono}">Teléfono</td>
                    <td th:text="${pedido.observaciones}">Observaciones</td>

                    <td>
                        <span th:text="${pedido.estado}"
                              th:classappend="${pedido.estado == 'ENTREGADO'} ? 'badge bg-success' :
                                              (pedido.estado == 'EN_CAMINO' ? 'badge bg-warning text-dark' : 'badge bg-secondary')">
                        </span>
                    </td>

                    <td>
                        <form th:action="@{'/actualizar/pedido/' + ${pedido.id}}" method="post">

                        <button type="submit" name="estado" value="EN CAMINO" class="btn btn-outline-warning btn-sm">
                                 EN CAMINO
                            </button>
                            <button type="submit" name="estado" value="HE LLEGADO" class="btn btn-outline-secondary btn-sm">
                                HE LLEGADO
                            </button>
                            <button type="submit" name="estado" value="ENTREGADO" class="btn btn-outline-success btn-sm">
                                 ENTREGADO
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- ✅ Si no hay pedidos -->
        <div th:if="${pedidos == null or pedidos.isEmpty()}" class="text-center mt-4">
            <p class="text-muted">No hay pedidos asignados en este momento.</p>
        </div>
    </section>
</main>

<!-- ⚓ Footer -->
<footer th:insert="Layouts/header_footerDomi :: footer"></footer>

<!-- 📜 Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
