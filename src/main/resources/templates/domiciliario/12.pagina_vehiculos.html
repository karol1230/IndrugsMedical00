<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vehículos - INDRUGS</title>

    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/1.estilos_pagina_inicio.css}" rel="stylesheet" />
    <link th:href="@{/css/12.estilos_pagina_vehiculos.css}" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
</head>

<body>
<header th:insert="Layouts/header_footerDomi :: header"></header>

<main class="cuerpo_indrugs">
    <div th:replace="~{Layouts/header_footerDomi :: error}"></div>

    <section class="vehiculos-section">
        <h1>Vehículos registrados</h1>
        <!-- Mensaje de éxito -->
        <div th:if="${mensajeExito}" class="alert alert-success">
            <p th:text="${mensajeExito}"></p>
        </div>


        <div th:if="${vehiculos != null and !vehiculos.isEmpty()}">
            <div class="table-responsive">
                <table id="tabla1" class="table table-hover align-middle shadow-sm">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th><i class="fas fa-user"></i> Propietario</th>
                        <th><i class="fas fa-car"></i> Tipo</th>
                        <th><i class="fas fa-id-card"></i> Placa</th>
                        <th><i class="fas fa-palette"></i> Color</th>
                        <th><i class="fas fa-industry"></i> Marca</th>
                        <th><i class="fas fa-toggle-on"></i> Estado</th>
                        <th><i class="fas fa-cogs"></i> Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="vehiculo : ${vehiculos}">
                        <td th:text="${vehiculo.idVehiculo}"></td>
                        <td th:text="${vehiculo.nombreUsuario}"></td>
                        <td th:text="${vehiculo.tipoVehiculo}"></td>
                        <td th:text="${vehiculo.placaVehiculo}"></td>
                        <td th:text="${vehiculo.colorVehiculo}"></td>
                        <td th:text="${vehiculo.marcaVehiculo}"></td>
                        <td>
                            <span th:text="${vehiculo.estadoVehiculo}"
                                  th:classappend="${vehiculo.estadoVehiculo == 'Activo'} ? 'badge bg-success' : 'badge bg-secondary'"></span>
                        </td>
                        <td>
                            <!-- Formulario para activar / inhabilitar -->
                            <form th:action="@{/vehiculo/{idVehiculo}/estado(idVehiculo=${vehiculo.idVehiculo})}" method="post" style="display:inline;">
                                <input type="hidden" name="nuevoEstado" th:value="${vehiculo.estadoVehiculo == 'Activo'} ? 'Inactivo' : 'Activo'" />
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${vehiculo.estadoVehiculo == 'Activo'} ? 'btn-danger' : 'btn-success'">
                                    <i th:class="${vehiculo.estadoVehiculo == 'Activo'} ? 'fas fa-ban' : 'fas fa-check-circle'"></i>
                                    <span th:text="${vehiculo.estadoVehiculo == 'Activo'} ? 'Inhabilitar' : 'Activar'"></span>
                                </button>
                            </form>

                            <!-- Botón para eliminar -->
                            <a th:href="@{/vehiculo/eliminar/{idVehiculo}(idVehiculo=${vehiculo.idVehiculo})}"
                               class="btn btn-sm btn-eliminar ms-1">
                                <i class="fas fa-trash"></i> Eliminar
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${vehiculos == null or #lists.isEmpty(vehiculos)}" class="no-data">
            <p><i class="fas fa-exclamation-circle"></i> No hay datos de vehículos registrados.</p>
        </div>

        <div class="boton-agregar mt-3">
            <a th:href="@{/13.pagina_agregar_vehiculo}" class="btn btn-agregar">
                <i class="fas fa-plus-circle"></i> Agregar vehículo
            </a>
        </div>

    </section>
</main>
<footer th:insert="Layouts/header_footerDomi :: footer"></footer>


</body>
</html>
