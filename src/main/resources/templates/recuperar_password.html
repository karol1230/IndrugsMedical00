<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña</title>

  <!-- Bootstrap -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <!-- Estilos personalizados (mismos tonos de tu app) -->
  <style>
    body {
        background: #e8f5f3; /* Verde agua muy suave */
    }

    .card-custom {
        width: 380px;
        border-radius: 18px;
        padding: 30px;
        background: white;
        border: none;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.10);
    }

    h3 {
        color: #00796b;
        font-weight: 700;
    }

    .btn-custom {
        background-color: #00796b;
        border: none;
        font-weight: 600;
        padding: 10px;
        border-radius: 8px;
    }

    .btn-custom:hover {
        background-color: #00695c;
    }

    a {
        color: #00796b;
        text-decoration: none;
        font-weight: 500;
    }

    a:hover {
        text-decoration: underline;
    }
  </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card card-custom">

    <h3 class="text-center mb-2">Recuperar Contraseña</h3>
    <!-- MENSAJE DE ÉXITO -->
    <div th:if="${exito}" class="alert alert-success text-center" role="alert">
      <span th:text="${exito}"></span>
    </div>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${error}" class="alert alert-danger text-center" role="alert">
      <span th:text="${error}"></span>
    </div>


    <p class="text-center text-muted mb-4" style="font-size: 14px;">
      Ingresa tu correo y te enviaremos una nueva contraseña temporal.
    </p>

    <!-- FORMULARIO -->
    <form th:action="@{/recuperar}" method="post">

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email"
               name="correo"
               class="form-control"
               placeholder="ejemplo@correo.com"
               required>
      </div>

      <button class="btn btn-custom w-100 mt-2" type="submit">
        Enviar nueva contraseña
      </button>
    </form>

    <!-- ENLACE DE REGRESO -->
    <div class="text-center mt-3">
      <a th:href="@{/login}">Volver al inicio de sesión</a>
    </div>

  </div>
</div>

</body>
</html>
