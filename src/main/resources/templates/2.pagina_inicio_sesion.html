<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            background: url('/imagenes/Medicamento/fondologin.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.35);
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            max-width: 500px;
            width: 90%;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        h3 {
            text-align: center;
            color: #004d40;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .btn-primary {
            background: linear-gradient(180deg, #00796b 0%, #00695c 100%);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #00695c 0%, #004d40 100%);
        }

        a {
            color: #00695c;
            font-weight: 500;
        }

        a:hover {
            color: #004d40;
            text-decoration: underline;
        }

        .alert-danger {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div style="position: absolute; top: 20px; left: 20px;">
    <button onclick="window.history.back()"
            style="
            padding: 10px 24px;
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(0, 121, 107, 0.35);
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        "
            onmouseover="this.style.backgroundColor='#009882'; this.style.boxShadow='0 6px 14px rgba(0, 152, 130, 0.45)'; this.style.transform='translateY(-2px)'"
            onmouseout="this.style.backgroundColor='#00796b'; this.style.boxShadow='0 4px 12px rgba(0, 121, 107, 0.35)'; this.style.transform='translateY(0)'"
    >
        ← Volver
    </button>
</div>


<div class="login-card">
    <h3>Iniciar sesión</h3>

    <!-- Mostrar mensaje de error si el login falla -->
    <div th:if="${error}" class="alert alert-danger text-center">
        <strong th:text="${error}"></strong>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" minlength="6" required>
        </div>

        <!-- Campo visual solo informativo -->
        <div class="mb-3">

        </div>

        <button class="btn btn-primary w-100">Ingresar</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/registrarse}">¿No tienes cuenta? Regístrate</a>
    </div>
    <div class="text-center mt-3">
        <a th:href="@{/recuperar}">¿Olvidaste tu contraseña?</a>
    </div>

</div>
</body>


</html>
