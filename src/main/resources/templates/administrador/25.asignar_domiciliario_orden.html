<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asignar Domiciliario | INDRUGS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header th:insert="Layouts/header_footerAdmin :: header"></header>

<div class="container mt-5 mb-5">
    <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0">Asignar Domiciliario al Pedido</h4>
        </div>

        <div class="card-body p-4">
            <!-- Información de la orden -->
            <h5 class="mb-3 text-secondary">Información de la Orden</h5>
            <ul class="list-group mb-4 shadow-sm">
                <li class="list-group-item"><strong>ID:</strong> <span th:text="${orden.idOrden}"></span></li>
                <li class="list-group-item"><strong>Paciente:</strong> <span th:text="${orden.pacienteNombre}"></span></li>
                <li class="list-group-item"><strong>Dirección:</strong> <span th:text="${orden.direccionOrden}"></span></li>
                <li class="list-group-item"><strong>Teléfono:</strong> <span th:text="${orden.telefonoOrden}"></span></li>
                <li class="list-group-item"><strong>Fecha de Entrega:</strong>
                    <span th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></span>
                </li>
            </ul>

            <!-- Formulario para asignar domiciliario -->
            <form th:action="@{/orden/asignar-domiciliario}" method="post">
                <!-- ID de la orden oculto -->
                <input type="hidden" name="idOrden" th:value="${orden.idOrden}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">Seleccionar Domiciliario</label>
                    <select name="idDomiciliario" class="form-select" required>
                        <option value="">-- Seleccione un domiciliario --</option>
                        <option th:each="domi : ${domiciliarios}"
                                th:value="${domi.idUsuario}"
                                th:text="${domi.nombre} + ' (' + domi.correo + ')'">
                        </option>
                    </select>
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-4 me-2">
                        <i class="bi bi-check-circle"></i> Asignar
                    </button>
                    <a th:href="@{/18.pagina_orden_admin}" class="btn btn-secondary px-4">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
