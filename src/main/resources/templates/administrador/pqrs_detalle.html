<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Detalle PQRS</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
  <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Arial', sans-serif;
    }

    h2 {
      color: #00796b;
      font-weight: 700;
    }

    .card {
      border-radius: 20px;
      border: none;
      overflow: hidden;
      background: linear-gradient(135deg, #e0f2f1, #ffffff); /* degradado sutil */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* sombra más marcada */
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    .card-body {
      padding: 30px;
    }

    .card h4 {
      color: #00796b;
      margin-bottom: 20px;
      font-weight: 600;
      border-bottom: 2px solid #00796b20; /* línea decorativa */
      padding-bottom: 5px;
    }

    .form-label {
      font-weight: 500;
      color: #333333;
    }

    .btn-success {
      background-color: #7B1FA2; /* morado llamativo */
      border: none;
      transition: background-color 0.3s;
    }

    .btn-success:hover {
      background-color: #4A148C;
    }

    .btn-secondary {
      transition: background-color 0.3s, color 0.3s;
    }

    .btn-secondary:hover {
      background-color: #00796b;
      color: white;
    }

    p {
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }

    hr {
      border-top: 2px solid #e0e0e0;
      margin: 25px 0;
    }

    .btn-container {
      margin-top: 15px;
    }

    .btn-container .btn {
      margin-right: 10px;
    }

    @media (max-width: 576px) {
      .card-body {
        padding: 20px;
      }
    }
    header {
    padding-bottom: 70px;
     }
  </style>
</head>

<body>
<header th:insert="Layouts/header_footerAdmin :: header"></header>

<div class="container mt-5 mb-5">
  <h2 class="text-center mb-4">Detalle PQRS</h2>

  <div class="card">
    <div class="card-body">

      <h5><strong>ID PQRS:</strong> <span th:text="${pqrs.idPqrs}"></span></h5>
      <p><strong>Usuario:</strong> <span th:text="${pqrs.nombreUsuario}"></span></p>
      <p><strong>Tipo:</strong> <span th:text="${pqrs.tipoPqrs}"></span></p>
      <p><strong>Motivo:</strong> <span th:text="${pqrs.motivo}"></span></p>
      <p><strong>Fecha:</strong>
        <span th:text="${#temporals.format(pqrs.fechaPqrs, 'dd-MM-yyyy HH:mm')}"></span>
      </p>
      <p><strong>Estado actual:</strong> <span th:text="${pqrs.estado}"></span></p>
      <p><strong>Respuesta actual:</strong>
        <span th:text="${pqrs.respuesta != null ? pqrs.respuesta : 'Sin respuesta'}"></span>
      </p>

      <hr>

      <h4>Responder PQRS</h4>

      <form th:action="@{'/administrador/pqrs/' + ${pqrs.idPqrs} + '/responder'}" method="post">

        <div class="mb-3">
          <label class="form-label">Responder al usuario:</label>
          <textarea class="form-control" name="respuesta" rows="4" required></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Cambiar estado:</label>
          <select class="form-select" name="estado" required>
            <option value="Pendiente">Pendiente</option>
            <option value="En proceso">En proceso</option>
            <option value="Resuelto">Resuelto</option>
          </select>
        </div>

        <div class="btn-container">
          <button class="btn btn-success" type="submit">Guardar respuesta</button>
          <a href="/administrador/pqrs" class="btn btn-secondary">Volver</a>
        </div>

      </form>

    </div>
  </div>
</div>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>
</body>
</html>
