<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Indrugs - Administrador</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/14.estilos_pagina_órdenes.css}">
</head>
<body>
<header th:insert="Layouts/header_footerAdmin :: header"></header>

<main class="cuerpo_indrugs container py-4">
    <div th:insert="Layouts/header_footerAdmin :: error"></div>
    <h1 class="text-center mb-4">Gestión de Órdenes</h1>

    <div th:if="${ordenes != null and !ordenes.isEmpty()}">
        <table id="tabla1" class="table table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th>ID</th>
                <th>Paciente</th>
                <th>EPS</th>
                <th>Fecha de entrega</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Cantidad</th>
                <th>Medicamentos</th>
                <th>Fórmula médica</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="orden : ${ordenes}">
                <td th:text="${orden.idOrden}"></td>
                <td th:text="${orden.pacienteNombre}"></td>
                <td th:text="${orden.epsOrden}"></td>
                <td th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${orden.direccionOrden}"></td>
                <td th:text="${orden.telefonoOrden}"></td>
                <td th:text="${orden.cantidad}"></td>
                <td>
                    <ul class="list-unstyled">
                        <li th:each="med : ${orden.medicamentos}" th:text="${med}"></li>
                    </ul>
                </td>
                <td>
                    <a th:if="${orden.fotoFormula != null}" th:href="@{${orden.fotoFormula}}" target="_blank" class="btn btn-sm btn-info">
                        <i class="fas fa-file-pdf"></i> Ver PDF
                    </a>
                    <span th:if="${orden.fotoFormula == null}" class="text-muted">No subida</span>
                </td>
                <td th:text="${orden.estadoOrden}"></td>
                <td>
                    <div class="btn-group d-flex flex-column gap-2" role="group">
                        <!-- 🔹 Redirige a la página donde se asigna el domiciliario -->
                        <a th:href="@{/admin/asignar-domiciliario/{idOrden}(idOrden=${orden.idOrden})}"
                           class="btn btn-success btn-sm w-100">
                            <i class="fas fa-motorcycle"></i> Asignar domiciliario
                        </a>

                        <a th:href="@{/orden/admin/denegar/{idOrden}(idOrden=${orden.idOrden})}"
                           class="btn btn-danger btn-sm w-100"
                           th:if="${orden.estadoOrden != 'Denegada'}">
                            <i class="fas fa-times-circle"></i> Denegar
                        </a>

                        <a th:href="@{/ordenes/eliminar/{idOrden}(idOrden=${orden.idOrden})}"
                           class="btn btn-secondary btn-sm w-100">
                            <i class="fas fa-trash-alt"></i> Eliminar
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${ordenes == null or #lists.isEmpty(ordenes)}" class="alert alert-info text-center">
        <i class="fas fa-info-circle"></i> No hay órdenes registradas en el sistema.
    </div>
</main>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
