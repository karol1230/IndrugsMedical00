<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar usuario</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}" />
    <link rel="stylesheet" th:href="@{/css/menu_usuarios.css}" />
    <link rel="stylesheet" th:href="@{/css/editar_usuario.css}">

</head>
<body>

<header th:insert="Layouts/header_footerAdmin :: header"></header>

<main class="cuerpo_indrugs d-flex justify-content-center mt-5">

    <div class="card shadow-lg p-4" style="width: 550px; border-radius: 15px;">

        <h2 class="text-center mb-4" style="color: #0f766e; font-weight: 700;">
            Editar Usuario
        </h2>

        <form th:action="@{/actualizar}" method="post"
              class="row g-3 needs-validation" novalidate th:object="${usuario}">

            <input type="hidden" th:field="*{idUsuario}" />

            <!-- Nombre -->
            <div class="col-12">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required />
                <div class="invalid-feedback">Ingrese un nombre válido.</div>
            </div>

            <!-- Dirección -->
            <div class="col-12">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" id="direccion" class="form-control" th:field="*{direccion}" required />
                <div class="invalid-feedback">Ingrese una dirección válida.</div>
            </div>

            <!-- Teléfono -->
            <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" id="telefono" class="form-control" th:field="*{telefono}" required />
                <div class="invalid-feedback">Ingrese un teléfono válido.</div>
            </div>

            <!-- Correo -->
            <div class="col-md-6">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" id="correo" class="form-control" th:field="*{correo}" required />
                <div class="invalid-feedback">Ingrese un correo válido.</div>
            </div>

            <!-- Estado -->
            <div class="col-12">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" class="form-select" th:field="*{estado}">
                    <option th:each="estadoItem : ${estados}"
                            th:value="${estadoItem}"
                            th:text="${estadoItem}">
                    </option>
                </select>
                <div class="invalid-feedback">Seleccione un estado.</div>
            </div>

            <!-- Botón -->
            <div class="col-12 text-center mt-3">
                <button type="submit"
                        class="btn px-4 py-2"
                        style="background-color: #0f766e; color: white; font-size: 17px; border-radius: 10px;">
                    Guardar
                </button>
            </div>

        </form>
    </div>

</main>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
