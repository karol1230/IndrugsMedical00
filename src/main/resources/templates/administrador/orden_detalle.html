<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalle de Orden</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .detalle-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .detalle-label {
            font-weight: 600;
        }

        .btn-back {
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="detalle-container">
    <h2>Detalle de la Orden</h2>

    <div class="mb-3">
        <span class="detalle-label">ID Orden: </span>
        <span th:text="${orden.idOrden}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Paciente: </span>
        <span th:text="${orden.pacienteNombre}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Domiciliario: </span>
        <span th:text="${orden.nombreDomiciliario != null ? orden.nombreDomiciliario : 'No asignado'}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Dirección: </span>
        <span th:text="${orden.direccionOrden}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Teléfono: </span>
        <span th:text="${orden.telefonoOrden}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Medicamento: </span>
        <span th:text="${orden.nombreMedicamento}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Cantidad: </span>
        <span th:text="${orden.cantidad}"></span>
    </div>

    <div class="mb-3">
        <span class="detalle-label">Estado: </span>
        <span class="badge bg-info text-dark" th:text="${orden.estadoOrden}"></span>
    </div>

    <a th:href="@{/admin/ordenes-asignadas}" class="btn btn-secondary btn-back">Volver a Órdenes Asignadas</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
