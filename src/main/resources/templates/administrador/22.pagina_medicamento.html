<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medicamentos</title>

    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS NUEVO -->
    <link rel="stylesheet" th:href="@{/css/interfaz_medicamentos.css}">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
</head>

<body>

<header th:insert="Layouts/header_footerAdmin :: header"></header>

<main class="cuerpo_indrugs">
    <div class="contenido">

        <h1 class="titulo_pagina">
            <i class="fa-solid fa-pills"></i> Medicamentos
        </h1>

        <div class="card tabla-contenedor">

            <div th:if="${medicamentos != null and !medicamentos.isEmpty()}">
                <table class="table tabla-medicamentos">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Medicamento</th>
                        <th>Descripción</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="medicamento : ${medicamentos}">
                        <td th:text="${medicamento.idMedicamento}"></td>
                        <td th:text="${medicamento.nombreMedicamento}"></td>
                        <td th:text="${medicamento.descripcionMedicamento}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${medicamentos == null or medicamentos.isEmpty()}" class="text-center py-4">
                <p class="sin-datos">No hay registros disponibles.</p>
            </div>
        </div>

        <!-- BOTÓN CENTRADO -->
        <div class="contenedor-boton">
            <a th:href="@{/23.agregar_medicamentos}">
                <button class="btn btn-agregar">
                    <i class="fa-solid fa-plus"></i> Agregar medicamento
                </button>
            </a>
        </div>

    </div>
</main>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>

</body>
</html>
