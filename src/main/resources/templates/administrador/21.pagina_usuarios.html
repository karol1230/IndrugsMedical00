	<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inicio administrador</title>
	<script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
	<link rel="stylesheet" th:href="@{/css/menu_usuarios.css}">
	<link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
</head>

<body>
<header th:insert="Layouts/header_footerAdmin :: header"></header>

<main class="cuerpo_indrugs">

	<!-- MENSAJE DE ÉXITO -->
	<div th:if="${mensajeExito}" class="alert alert-success text-center" role="alert"
		 style="margin: 15px; font-size: 17px;">
		<span th:text="${mensajeExito}"></span>
	</div>

	<div th:insert="Layouts/header_footerAdmin :: error"></div>

	<div class="contenido">
		<h1 class="tabla_usuarios">USUARIOS</h1>

		<!-- ❌ BOTÓN DE CORREOS MASIVOS ELIMINADO -->

		<div class="formularios">

			<div class="filtrar-usuarios">
				<label>Filtrar por rol:</label>
				<select id="filtroRol">
					<option value="Todos">Todos</option>
					<option value="Paciente">Paciente</option>
					<option value="Domiciliario">Domiciliario</option>
					<option value="Administrador">Administrador</option>
				</select>

				<label>Estado:</label>
				<select id="filtroEstado">
					<option value="Todos">Todos</option>
					<option value="ACTIVO">Activo</option>
					<option value="INACTIVO">Inactivo</option>
				</select>

				<button class="butn_filtro" onclick="cargarEstadisticasUsuarios()">Filtrar</button>
			</div>

			<div class="acciones-estadisticas">
				<a th:href="@{/export/usuarios}">
					<button class="btn-usuario">
						<i class="fas fa-file-pdf"></i> Exportar PDF
					</button>
				</a>

				<a th:href="@{/admin/correos-masivos}" onclick="return confirmarEnvio();">
					<button class="btn-usuario">
						<i class="fas fa-paper-plane"></i> Enviar correos masivos
					</button>
				</a>
			</div>

		</div>


		<div th:if="${usuarios != null && !usuarios.isEmpty()}">
			<div style="display: flex; justify-content: center; width: 100%; margin-top: 20px;">
				<table id="tabla1" class="table">
					<thead class="table-dark">
					<tr>
						<th>Rol</th>
						<th>Nombre</th>
						<th>Tipo de documento</th>
						<th>Número de documento</th>
						<th>Dirección</th>
						<th>Teléfono</th>
						<th>Correo</th>
						<th>Estado</th>
						<th>Editar</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="usuario : ${usuarios}">
						<td th:text="${usuario.nombreRol}"></td>
						<td th:text="${usuario.nombre}"></td>
						<td th:text="${usuario.tipoDoc}"></td>
						<td th:text="${usuario.numDoc}"></td>
						<td th:text="${usuario.direccion}"></td>
						<td th:text="${usuario.telefono}"></td>
						<td th:text="${usuario.correo}"></td>
						<td th:text="${usuario.estado}"></td>
						<td>
							<a th:href="@{'/actualizar?idUsuario=' + ${usuario.idUsuario}}">
								<button class="btn btn-primary">Editar</button>
							</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div th:if="${usuarios == null || usuarios.isEmpty()}">
			<p>No hay usuarios registrados.</p>
		</div>

	</div>
</main>

<footer th:insert="Layouts/header_footerAdmin :: footer"></footer>

<!-- CONFIRMACIÓN -->
<script>
	function confirmarEnvio() {
        return confirm("¿Estás seguro de enviar los correos masivos?");
    }
</script>

</body>
</html>
