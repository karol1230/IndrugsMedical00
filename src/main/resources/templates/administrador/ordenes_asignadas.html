<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Órdenes Asignadas</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

  <style>
    body {
        background: #f4f6f9;
    }

    .table-container {
        max-width: 1200px;
        margin: 30px auto;
        padding: 25px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
        font-weight: 700;
        margin-bottom: 20px;
    }

    .badge {
        font-size: 0.9rem;
    }

    .btn-estado {
        font-size: 0.85rem;
    }
  </style>
</head>

<body>

<div class="table-container">
  <h2 class="text-center">Órdenes Asignadas a domiciliarios </h2>

  <table class="table table-hover table-bordered text-center align-middle">
    <thead class="table-primary">
    <tr>
      <th>ID</th>
      <th>Paciente</th>
      <th>Domicilio</th>
      <th>Dirección</th>
      <th>Teléfono</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="orden : ${ordenes}">
      <td th:text="${orden.idOrden}"></td>

      <td>
        <span th:text="${orden.pacienteNombre}">Nombre</span>
      </td>

      <td>
        <span th:text="${orden.nombreDomiciliario != null ? orden.nombreDomiciliario : 'No asignado'}"></span>
      </td>




      <td th:text="${orden.direccionOrden}"></td>

      <td th:text="${orden.telefonoOrden}"></td>

      <td>
        <span class="badge bg-info text-dark" th:text="${orden.estadoDomicilio != null ? orden.estadoDomicilio : 'No asignado'}"></span>
      </td>


      <td>
        <a th:href="@{'/admin/orden/detalle/' + ${orden.idOrden}}"
           class="btn btn-sm btn-primary">
          Ver Detalles
        </a>
      </td>
    </tr>
    </tbody>
  </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
