<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Únete a Nuestro Equipo - Indrugs Medica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<header th:insert="Layouts/header_footer :: header"></header>

<div class="container my-5 p-4 bg-white shadow rounded" style="max-width: 700px;">

    <h2 class="text-center fw-bold mb-4"
        style="color:#00796b; border-bottom:0.5px solid #00796b;  padding-bottom:15px;">
        Únete a Nuestro Equipo
    </h2>


    <!-- Mensajes -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/unete}" method="post" th:object="${candidato}" enctype="multipart/form-data">

        <!-- Tipo de documento -->
        <div class="mb-3">
            <label class="form-label">Tipo de documento</label>
            <select class="form-select" th:field="*{tipoDoc}" required>
                <option value="" disabled selected>Seleccione</option>
                <option value="CC">Cédula de ciudadanía</option>
            </select>
        </div>

        <!-- Número de documento -->
        <div class="mb-3">
            <label class="form-label">Número de documento</label>
            <input type="number" class="form-control" th:field="*{numDoc}" required minlength="8">
        </div>

        <!-- Nombre -->
        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>

        <!-- Correo -->
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" th:field="*{correo}" required>
        </div>

        <!-- Dirección -->
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}" required>
        </div>

        <!-- Teléfono -->
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" th:field="*{telefono}" required minlength="7" maxlength="10">
        </div>

        <!-- Vehículo -->
        <div class="mb-3">
            <label class="form-label">Tipo de vehículo</label>
            <select name="vehiculo" class="form-select" required>
                <option value="" disabled selected>Seleccione</option>
                <option value="Moto">Moto</option>
                <option value="Carro">Carro</option>
            </select>
        </div>

        <!-- PDF Hoja de vida -->
        <div class="mb-3">
            <label class="form-label">Hoja de vida (PDF)</label>
            <input type="file" name="cv" class="form-control" accept="application/pdf" required>
        </div>

        <!-- PDF Licencia de conducción -->
        <div class="mb-3">
            <label class="form-label">Licencia de conducción (PDF)</label>
            <input type="file" name="licenciaPdf" class="form-control" accept="application/pdf" required>
        </div>

        <!-- PDF Tarjeta de propiedad -->
        <div class="mb-3">
            <label class="form-label">Tarjeta de propiedad (PDF)</label>
            <input type="file" name="tarjetaPdf" class="form-control" accept="application/pdf" required>
        </div>

        <button type="submit" class="btn w-100"
                style="background:#00796b; color:white; padding:12px; border-radius:10px;
               box-shadow:0 4px 10px rgba(0,0,0,0.2); transition:0.3s;">
            Enviar postulación
        </button>

    </form>
</div>

<footer th:insert="Layouts/header_footer :: footer"></footer>

</body>
</html>
