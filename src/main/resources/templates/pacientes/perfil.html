<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil del Usuario</title>
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
    <style>
        /* Espacio desde el header fijo */
        body {
            padding-top: 120px; /* Ajusta según la altura de tu header */
            background: #f0f4f3;
            font-family: 'Arial', sans-serif;
        }

        /* Contenedor general del perfil */
        .perfil-container {
            max-width: 600px;
            margin: 30px auto 50px auto;
            padding: 30px 40px;
            border-radius: 15px;
            background: #f7f9f8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s ease-in-out;
        }

        .perfil-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2a7a4f;
            font-size: 28px;
            letter-spacing: 1px;
        }

        /* Tabla estilo moderno */
        .perfil-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 15px;
        }

        .perfil-table td {
            padding: 8px;
            vertical-align: middle;
        }

        .perfil-table td:first-child {
            font-weight: bold;
            width: 40%;
            color: #555;
        }

        /* Inputs estilizados */
        .perfil-table input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        .perfil-table input:focus {
            border-color: #2a7a4f;
            outline: none;
            box-shadow: 0 0 5px rgba(42, 122, 79, 0.3);
        }

        /* Botón elegante */
        .perfil-container button {
            padding: 10px 25px;
            background-color: #2a7a4f;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .perfil-container button:hover {
            background-color: #1e5739;
        }

        /* Rol no editable */
        .perfil-table td[th\\:text] {
            font-weight: normal;
            color: #333;
        }

        /* Mensaje de éxito */
        .mensaje-exito {
            max-width: 600px;
            margin: 0 auto 20px auto;
            text-align: center;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            position: relative;
            z-index: 100;
        }
        body {
           padding-top: 140px; /* 100px header + 40px espacio */
            background: #f0f4f3;
           font-family: 'Arial', sans-serif;
        }
        /* Contenedor del perfil separado del header */
.perfil-container {
    max-width: 600px;
    margin: 150px auto 50px auto; /* Ajusta 150px según la altura de tu header */
    padding: 30px 40px;
    border-radius: 15px;
    background: #f7f9f8;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* Mensaje de éxito separado */
.mensaje-exito {
    max-width: 600px;
    margin: 120px auto 30px auto; /* margen superior para no quedar detrás del header */
    text-align: center;
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    padding: 15px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 16px;
    position: relative;
    z-index: 100;
}

    </style>
</head>
<body>

<!-- Header -->
<th:block th:replace="~{Layouts/header_footerPaciente :: header}"></th:block>

<!-- Mensaje de éxito -->
<div th:if="${mensajeExito}" class="mensaje-exito">
    <p th:text="${mensajeExito}"></p>
</div>

<!-- Contenedor del perfil -->
<div class="perfil-container">
    <h2>Mi Perfil</h2>

    <form th:action="@{/perfil/paciente/actualizar}" th:object="${usuario}" method="post">
    <table class="perfil-table">
            <tr>
                <td>Nombre:</td>
                <td><input type="text" th:field="*{nombre}" /></td>
            </tr>
            <tr>
                <td>Rol:</td>
                <td th:text="${usuario.rol.nombreRol}"></td>
            </tr>
            <tr>
                <td>Tipo de Documento:</td>
                <td><input type="text" th:field="*{tipoDoc}" /></td>
            </tr>
            <tr>
                <td>Número de Documento:</td>
                <td><input type="text" th:field="*{numDoc}" /></td>
            </tr>
            <tr>
                <td>Dirección:</td>
                <td><input type="text" th:field="*{direccion}" /></td>
            </tr>
            <tr>
                <td>Teléfono:</td>
                <td><input type="text" th:field="*{telefono}" /></td>
            </tr>
            <tr>
                <td>Correo:</td>
                <td><input type="email" th:field="*{correo}" /></td>
            </tr>
        </table>

        <div style="text-align:center; margin-top:20px;">
            <button type="submit">Actualizar</button>
        </div>
    </form>
</div>

<!-- Footer -->
<th:block th:replace="~{Layouts/header_footerPaciente :: footer}"></th:block>

</body>
</html>
