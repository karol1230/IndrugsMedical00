<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PQRS</title>

    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}" />
    <link rel="stylesheet" th:href="@{/css/5.estilos_pagina_pqrs.css}" />
    <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">
</head>

<body>
<header th:insert="Layouts/header_footerPaciente :: header"></header>

<main class="cuerpo_indrugs">

    <div th:insert="Layouts/header_footerPaciente :: error"></div>

    <div class="contenido-elegante">

        <h1 class="titulo-pqrs">Formulario de PQRS</h1>
        <p class="subtitulo">Envíanos tu solicitud — todos los campos son obligatorios</p>

        <div class="tarjeta-form">

            <form method="post" th:action="@{/guardar-pqrs}"
                  th:object="${pqrs}"
                  class="needs-validation" novalidate>

                <input type="hidden" th:field="*{usuarioid}" th:value="${usuarioLogueado.idUsuario}" />

                <!-- Tipo -->
                <div class="mb-4">
                    <label for="tipoPqrs" class="form-label label-elegante">
                        <i class="fas fa-list"></i> Tipo de solicitud
                    </label>
                    <select id="tipoPqrs" th:field="*{tipoPqrs}" class="form-control control-elegante" required>
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="Petición">Petición</option>
                        <option value="Queja">Queja</option>
                        <option value="Reclamo">Reclamo</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                    <div class="invalid-feedback">Debe seleccionar un tipo.</div>
                </div>

                <!-- Motivo -->
                <div class="mb-4">
                    <label for="motivo" class="form-label label-elegante">
                        <i class="fas fa-pen"></i> Descripción del motivo
                    </label>
                    <textarea id="motivo" th:field="*{motivo}" class="form-control textarea-elegante" rows="4" required></textarea>
                    <div class="invalid-feedback">Debe ingresar un motivo.</div>
                </div>

                <!-- Botón -->
                <button class="btn-enviar" type="submit">
                    <i class="fas fa-paper-plane"></i> Enviar PQRS
                </button>

            </form>
        </div>

    </div>
</main>

<footer th:insert="Layouts/header_footerPaciente :: footer"></footer>

<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>

</body>
</html>
