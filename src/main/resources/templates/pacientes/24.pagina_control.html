<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controles - INDRUGS</title>

    <!-- 🔗 Librerías y estilos -->
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">


    <style>
        /* Contenedor principal */
        .contenido {
            margin-top: 40px;
            padding: 30px;
            background-color: #f9f9f9;
            border-radius: 10px;
        }

        /* Título */
        #titulo_control {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: #00796b;
            margin-bottom: 30px;
        }

        /* Tarjetas de controles */
        .control-card {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-left: 5px solid #b497d6; /* borde lila claro */
        }

        .control-card:hover {
            transform: translateY(-10px);
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }

        .control-card h5 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #00796b;
            margin-bottom: 15px;
        }

        .control-card i {
            color: #00796b;
            margin-right: 10px;
        }

        .control-card p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .control-card .detail-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-card .detail-item span {
            margin-left: 10px;
        }

        /* Botones dentro de las tarjetas */
        .control-card .btn-control, .control-card .btn-eliminar {
            background-color: #8e44ad;  /* morado brillante */
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            text-align: center;
            border: none;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-top: 10px;
        }

        .control-card .btn-control:hover, .control-card .btn-eliminar:hover {
            background-color: #732d91;  /* morado oscuro */
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            transform: scale(1.05);
        }

        /* Listado de controles */
        .listado-controles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .no-controles {
            text-align: center;
            font-size: 1.2rem;
            color: #888;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f7f7f7;
            margin: 0;
        }

        /* Mensaje de éxito */
        .alert {
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
<header th:insert="Layouts/header_footerPaciente :: header"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>

    <div class="contenido">
        <h1 id="titulo_control">Controles Médicos</h1>

        <!-- Mensaje de éxito -->
        <div th:if="${mensajeExito != null}" class="alert alert-success" role="alert">
            <span th:text="${mensajeExito}"></span>
        </div>

        <!-- Listado de controles -->
        <div th:if="${controles != null and !controles.isEmpty()}" class="listado-controles">
            <div th:each="control : ${controles}" class="control-card">
                <h5 th:text="${control.nombreMedicamento}"></h5>

                <!-- Detalles con iconos -->
                <div class="detail-item">
                    <i class="fas fa-user"></i><strong>Paciente:</strong> <span th:text="${control.nombreUsuario}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-calendar-check"></i><strong>Inicio Tratamiento:</strong> <span th:text="${#temporals.format(control.fechaInicioTratamiento, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-calendar-times"></i><strong>Fin Tratamiento:</strong> <span th:text="${#temporals.format(control.fechaFinTratamiento, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-heartbeat"></i><strong>Problema Salud:</strong> <span th:text="${control.problemaSalud}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-pills"></i><strong>Cantidad Medicamentos:</strong> <span th:text="${control.cantidadMedic}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-clock"></i><strong>Frecuencia Medicamento:</strong> <span th:text="${control.frecuenciaMedic}"></span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-bell"></i><strong>Alarma:</strong> <span th:text="${control.alarmaControl}"></span>
                </div>

                <!-- Botones de acción -->
                <a th:href="@{/3.pagina_de_control}" class="btn-control">Nuevo Control</a>

                <form th:action="@{/eliminar_control}" method="post" class="mt-3">
                    <input type="hidden" name="idControl" th:value="${control.idControl}"/>
                    <button type="submit" class="btn-eliminar">
                        <i class="fas fa-trash-alt"></i> Eliminar Control
                    </button>
                </form>
            </div>
        </div>


        <!-- Si no hay controles -->
        <div th:if="${controles == null or controles.isEmpty()}" class="no-controles text-center">
            <p>No hay controles registrados.</p>
            <a th:href="@{/3.pagina_de_control}" class="btn-control mt-3">
                <i class="fas fa-plus"></i> Añadir primer control
            </a>
        </div>

    </div>
</main>

<footer th:insert="Layouts/header_footerPaciente :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
