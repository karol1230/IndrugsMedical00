<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #e9fef6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* TARJETA DE CONFIRMACIÓN */
        .card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 420px;
            margin-right: 30px;
        }
        h1 { color: #009970; margin-bottom: 5px; }
        p { color: #555; font-size: 15px; margin-bottom: 10px; }
        img { width: 180px; height: 180px; object-fit: cover; border-radius: 15px; margin: 20px 0; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        h2 { font-size: 22px; color: #222; margin-bottom: 10px; }
        .info { background: #f9f9f9; border-radius: 12px; padding: 15px; text-align: left; margin: 15px 0; line-height: 1.6; font-size: 14px; }
        .info strong { color: #009970; }
        .btn { display: inline-block; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: all 0.3s; margin: 8px 5px; cursor: pointer; }
        .btn-primary { background: #009970; color:white; }
        .btn-primary:hover { background:#007e5c; }
        .btn-outline { background:#fff; color:#009970; border:2px solid #009970; }
        .btn-outline:hover { background:#009970; color:white; }
        .btn-blue { background:#00796b; color:white; border:none; }
        .btn-blue:hover { background:#00695c; }
        footer { margin-top: 15px; font-size: 13px; color: #777; }

        /* CONTENEDOR DEL PDF */
        .factura-container { display:none; }
    </style>
</head>
<body>

<!-- TARJETA DE CONFIRMACIÓN DEL PEDIDO -->
<div class="card">
    <h1>✅ Pedido Registrado</h1>
    <p>Tu solicitud fue guardada exitosamente.</p>

    <img th:src="@{'/imagenes/MEDICAMENTOS/TABLA/' + ${medicamento.imagenMedicamento}}" alt="Medicamento">
    <h2 id="nombreMedicamento" th:text="${medicamento.nombreMedicamento}"></h2>

    <div class="info">
        <p><strong>Cantidad tabletas:</strong> <span id="cantidad" th:text="${orden.cantidad}"></span></p>
        <p><strong>Fecha estimada de entrega:</strong> <span id="fechaEntrega" th:text="${orden.fechaEntrega}"></span></p>
        <p><strong>Nombre Paciente:</strong> <span id="nombrePaciente" th:text="${nombrePaciente}"></span></p>
        <p><strong>Dirección:</strong> <span id="direccionPaciente" th:text="${direccionPaciente}"></span></p>
        <p><strong>Teléfono:</strong> <span id="telefonoPaciente" th:text="${telefonoPaciente}"></span></p>
    </div>

    <a href="/16.pagina_carrito_med" class="btn btn-primary">🛒 Ir al carrito</a>
    <a href="/8.pagina_med" class="btn btn-outline">💊 Seguir comprando</a>
    <button class="btn btn-blue" onclick="descargarFactura()">📄 Descargar factura</button>

    <footer>Gracias por confiar en <strong>INDRUGS MEDICA</strong> 💚</footer>
</div>

<!-- CONTENEDOR OCULTO PARA PDF -->
<div class="factura-container" id="factura"></div>

<script>
    function descargarFactura() {
        const facturaDiv = document.getElementById('factura');

        // Tomar datos desde la tarjeta
        const datos = {
            fechaRegistro: new Date().toLocaleDateString(),
            nombrePaciente: document.getElementById('nombrePaciente').innerText,
            telefono: document.getElementById('telefonoPaciente').innerText,
            direccion: document.getElementById('direccionPaciente').innerText,
            fechaEntrega: document.getElementById('fechaEntrega').innerText,
            productos: [
                {
                    nombre: document.getElementById('nombreMedicamento').innerText,
                    cantidad: document.getElementById('cantidad').innerText
                }
            ]
        };

        // Construir HTML del PDF
        let productosHTML = '';
        datos.productos.forEach(p => {
            productosHTML += `<tr>
                <td style="border:1px solid #009970; padding:10px; text-align:center;">${p.nombre}</td>
                <td style="border:1px solid #009970; padding:10px; text-align:center;">${p.cantidad}</td>
            </tr>`;
        });

        facturaDiv.innerHTML = `
        <div style="width:100%; max-width:700px; padding:20px; font-family:Poppins,sans-serif; background:#fff; min-height:11in; display:block; position:relative;">
            <div style="text-align:left; border-bottom:3px solid #009970; padding-bottom:10px; margin-bottom:20px;">
                <h1 style="color:#009970; margin:0;">INDRUGS MEDICA</h1>
                <p><strong>Fecha del pedido:</strong> ${datos.fechaRegistro}</p>
            </div>

            <div style="margin-bottom:20px;">
                <p><strong>Nombre Paciente:</strong> ${datos.nombrePaciente}</p>
                <p><strong>Teléfono:</strong> ${datos.telefono}</p>
                <p><strong>Dirección:</strong> ${datos.direccion}</p>
                <p><strong>Fecha de entrega:</strong> ${datos.fechaEntrega}</p>
            </div>

            <table style="width:100%; border-collapse: collapse; margin-bottom:20px;">
                <thead>
                    <tr>
                        <th style="border:1px solid #009970; padding:10px; background:#009970; color:white;">Medicamento</th>
                        <th style="border:1px solid #009970; padding:10px; background:#009970; color:white;">Cantidad</th>
                    </tr>
                </thead>
                <tbody>${productosHTML}</tbody>
            </table>

            <footer style="text-align:center; font-size:12px; margin-top:20px;">
                Gracias por confiar en <strong>INDRUGS MEDICA</strong> 💚
            </footer>
        </div>`;

        facturaDiv.style.display = 'block';

        html2pdf().from(facturaDiv).set({
            margin: [0.5,0.5,0.5,0.5],
            filename: 'Factura_IndrugsMedica.pdf',
            html2canvas: { scale:2, useCORS:true },
            jsPDF: { unit:'in', format:'letter', orientation:'portrait' }
        }).save().then(()=>{ facturaDiv.style.display='none'; });
    }
</script>

</body>
</html>
