<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control</title>

    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/formulario_control.css}">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.9/dist/flatpickr.min.css" rel="stylesheet"> <!-- Calendario Personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
<header th:insert="Layouts/header_footerPaciente :: header"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>

    <div class="contenido">
        <h1 id="titulo_control">Medicamentos solicitados</h1>

        <!-- Si hay órdenes -->
        <div th:if="${ordenes != null and !ordenes.isEmpty()}">
            <table id="tabla1" class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>EPS</th>
                    <th>Fecha de entrega</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                    <th>Cantidad</th>
                    <th>Medicamentos</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="orden : ${ordenes}">
                    <td th:text="${orden.idOrden}"></td>
                    <td th:text="${orden.pacienteNombre}"></td>
                    <td th:text="${orden.epsOrden}"></td>
                    <td th:text="${#temporals.format(orden.fechaEntrega, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${orden.direccionOrden}"></td>
                    <td th:text="${orden.telefonoOrden}"></td>
                    <td th:text="${orden.cantidad}"></td>

                    <td>
                        <ul class="list-unstyled">
                            <li th:each="medicamento : ${orden.medicamentos}"
                                th:text="${medicamento}"></li>
                        </ul>
                    </td>

                    <td th:text="${orden.estadoOrden}"></td>

                    <td>
                        <a th:href="@{/ordenes/eliminar/{idOrden}(idOrden=${orden.idOrden})}"
                           class="btn btn-danger">
                            Eliminar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Si no hay órdenes -->
        <div th:if="${ordenes == null or #lists.isEmpty(ordenes)}"
             class="alert alert-info text-center">
            <i class="fas fa-info-circle"></i> No hay órdenes registradas en el sistema.
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/8.pagina_med}" class="btn btn-primary">
                Nuevo medicamento
            </a>
        </div>

    </div>
</main>


<footer th:insert="Layouts/header_footerPaciente :: footer"></footer>

<!-- Librerías JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.9/dist/flatpickr.min.js"></script> <!-- Calendario Personalizado -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    flatpickr("#iniciot", {
        dateFormat: "d/m/Y",  // Formato visible dd/MM/yyyy
        altInput: true,        // Usar un input alternativo
        altFormat: "d/m/Y",    // Formato alternativo para mostrar
        locale: "es",          // Español
        allowInput: true,      // Permitir que el usuario ingrese la fecha manualmente
        onChange: function(selectedDates, dateStr, instance) {
            // Al cambiar la fecha, aseguramos que el valor sea el adecuado para enviar
            let date = new Date(dateStr.split('/').reverse().join('/')); // Convertimos el formato dd/MM/yyyy a yyyy-MM-ddTHH:mm
            instance.input.value = date.toISOString().slice(0, 16); // Formato ISO yyyy-MM-ddTHH:mm
        }
    });

    flatpickr("#fint", {
        dateFormat: "d/m/Y",  // Formato visible dd/MM/yyyy
        altInput: true,        // Usar un input alternativo
        altFormat: "d/m/Y",    // Formato alternativo para mostrar
        locale: "es",          // Español
        allowInput: true,      // Permitir que el usuario ingrese la fecha manualmente
        onChange: function(selectedDates, dateStr, instance) {
            // Al cambiar la fecha, aseguramos que el valor sea el adecuado para enviar
            let date = new Date(dateStr.split('/').reverse().join('/')); // Convertimos el formato dd/MM/yyyy a yyyy-MM-ddTHH:mm
            instance.input.value = date.toISOString().slice(0, 16); // Formato ISO yyyy-MM-ddTHH:mm
        }
    });
    // Inicializar Flatpickr para el campo de hora (con reloj)
    flatpickr("#alarma", {
        enableTime: true,             // Habilitar el selector de tiempo
        noCalendar: true,             // Desactivar el calendario (solo mostrar el reloj)
        time_24hr: true,              // Usar formato de 24 horas
        dateFormat: "H:i",            // Formato de hora: hora:minuto
        minuteIncrement: 1,           // Incremento de minutos de 1
        locale: "es",                 // Español
        allowInput: true              // Permitir que se escriba directamente la hora si es necesario
    });
</script>



</body>
</html>
