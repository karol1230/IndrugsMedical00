<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control</title>
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/formulario_control.css}">

    <!-- FLATPICKR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
<header th:insert="Layouts/header_footerPaciente :: header"></header>

<main class="cuerpo_indrugs">
    <div th:insert="Layouts/header_footerPaciente :: error"></div>

    <div class="form-wrapper">
        <div class="form-card">

            <h1 id="titulo_control">
                <i class="fa-solid fa-notes-medical icon-title"></i> Control
            </h1>

            <form method="post" th:action="@{/agregar_control}" th:object="${control}"
                  class="row mx-auto mt-3 g-3 needs-validation" novalidate>

                <h2 class="section-title">Información personal</h2>

                <input type="hidden" name="idUsuario" th:value="${usuarioLogueado.idUsuario}" />

                <!-- FECHA INICIO -->
                <div class="col-md-6 col-12">
                    <label for="iniciot">Fecha inicio tratamiento:</label>
                    <input type="text" id="iniciot" class="form-control modern-input"
                           name="fechaInicioTratamiento" required>
                    <div class="valid-feedback">BIEN.</div>
                    <div class="invalid-feedback">Por favor ingrese una fecha correcta.</div>
                </div>

                <!-- FECHA FIN -->
                <div class="col-md-6 col-12">
                    <label for="fint">Fecha fin tratamiento:</label>
                    <input type="text" id="fint" class="form-control modern-input"
                           name="fechaFinTratamiento" required>
                    <div class="valid-feedback">BIEN.</div>
                    <div class="invalid-feedback">Por favor ingrese una fecha correcta.</div>
                </div>

                <h2 class="section-title">Información médica</h2>

                <div class="col-12">
                    <label for="problema">Problema de salud:</label>
                    <textarea id="problema" name="problemaSalud"
                              class="form-control modern-input" rows="4" required></textarea>
                </div>

                <div class="mt-3 col-6">
                    <label for="cantidad_frecuencia">Cantidad medicamento:</label>
                    <input type="text" name="cantidadMedic"
                           class="form-control modern-input" id="cantidad_frecuencia" required>
                </div>

                <div class="mt-3 col-6">
                    <label>Medicamento:</label>
                    <select th:field="*{idMedicamento}"
                            class="form-select modern-input" required>
                        <option value="" disabled selected>Seleccione un medicamento</option>
                        <option th:each="med : ${medicamentos}"
                                th:value="${med.idMedicamento}"
                                th:text="${med.nombreMedicamento}">
                        </option>
                    </select>
                </div>

                <div class="mt-3 col-6">
                    <label for="frecuencia">Frecuencia:</label>
                    <input type="text" name="frecuenciaMedic"
                           class="form-control modern-input" id="frecuencia" required>
                </div>

                <!-- HORA ALARMA -->
                <div class="mt-3 col-6">
                    <label for="alarma">Hora de alarma:</label>
                    <input type="text" id="alarma" class="form-control modern-input"
                           name="alarmaControl" required>
                </div>

                <div class="mt-3 col-12">
                    <button class="btn-submit" type="submit">Agregar control</button>
                </div>

            </form>

        </div>
    </div>

</main>

<footer th:insert="Layouts/header_footerPaciente :: footer"></footer>

<!-- FLATPICKR SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // ENVÍA dd/MM/yyyy HH:mm
    flatpickr("#iniciot", {
        enableTime: true,
        dateFormat: "d/m/Y H:i"
    });

    flatpickr("#fint", {
        enableTime: true,
        dateFormat: "d/m/Y H:i"
    });

    // Solo hora
    flatpickr("#alarma", {
        enableTime: true,
        noCalendar: true,
        dateFormat: "H:i"
    });
</script>

<script>
    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();
</script>

</body>
</html>
