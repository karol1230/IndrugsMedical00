<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${medicamento.nombreMedicamento}">Detalle Medicamento</title>

    <!-- Íconos -->
    <script src="https://kit.fontawesome.com/14122cd484.js" crossorigin="anonymous"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/1.estilos_pagina_inicio.css}">
    <link rel="stylesheet" th:href="@{/css/9.estilos_pagina_aspirina.css}">
    <link rel="stylesheet" th:href="@{/css/header-footer/header-footer.css}">

</head>

<body class="bg-light">

<header th:insert="Layouts/header_footerPaciente :: header"></header>

<main class="cuerpo_indrugs container py-5">

    <div class="contenido d-flex flex-column flex-lg-row align-items-center justify-content-center gap-5 detalle-premium">

        <!-- Imagen del medicamento -->
        <div class="tarjeta-img shadow-lg rounded-4">
            <img class="img-premium"
                 th:src="@{'/imagenes/MEDICAMENTOS/TABLA/' + ${medicamento.imagenMedicamento}}"
                 th:alt="${medicamento.nombreMedicamento}">
        </div>


        <!-- Información del medicamento -->
        <div class="info-medicamento tarjeta-info-premium shadow-lg rounded-4 p-4">
            <h1 class="nombre-medicamento titulo-premium mb-3" th:text="${medicamento.nombreMedicamento}">Nombre Medicamento</h1>
            <p class="descripcion-medicamento categoria-premium mb-4" th:text="${medicamento.descripcionMedicamento}">
                Descripción del medicamento
            </p>

            <label for="cantidad_solicitada" class="form-label fw-semibold cantidad-label-premium">Elija la cantidad</label>
            <input id="cantidad_solicitada"
                   type="number"
                   name="cantidad"
                   class="form-control input-premium w-50"
                   min="1"
                   max="10"
                   required>

            <button id="boton_solicitar" class="btn btn-success btn-premium mt-3 px-4 py-2">
                <i class="fa-solid fa-cart-plus me-2"></i> Solicitar
            </button>
        </div>

    </div>
</main>


<footer th:insert="Layouts/header_footerPaciente :: footer"></footer>

<script th:inline="javascript">
    document.getElementById('boton_solicitar').addEventListener('click', function() {
        const cantidad = document.getElementById('cantidad_solicitada').value;
        const idMedicamento = [[${medicamento.idMedicamento}]];

        if (cantidad < 1 || cantidad > 10) {
            alert('Por favor, seleccione una cantidad entre 1 y 10');
            return;
        }

        window.location.href = `/nuevo?idMedicamento=${idMedicamento}&cantidad=${cantidad}`;
    });
</script>

</body>
</html>
